<!doctype html><html lang=uk><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Пошук зображень</title><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel=stylesheet><style>body{background-color:#f5f5f5;margin:0;padding:20px;font-family:sans-serif}.search-form{justify-content:center;margin-bottom:20px;display:flex}.search-form input{border:1px solid #ccc;border-radius:4px;width:300px;padding:10px;font-size:16px}.gallery{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:0 0 20px;padding:0;list-style:none;display:grid}.photo-card{background:#fff;border-radius:4px;flex-direction:column;display:flex;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.1)}.photo-card img{object-fit:cover;width:100%;height:200px}.stats{color:#555;justify-content:space-around;padding:10px;font-size:14px;display:flex}.stats-item{align-items:center;gap:4px;margin:0;display:flex}.stats-item .material-icons{color:#757575;font-size:18px}.load-more-btn{color:#fff;cursor:pointer;background-color:#3f51b5;border:none;border-radius:4px;margin:0 auto;padding:10px 20px;font-size:16px;display:block}.load-more-btn:hover{background-color:#303f9f}.is-hidden{display:none!important}</style><script defer src=bundle.js></script></head><body><form class=search-form id=search-form><input name=query autocomplete=off placeholder="Search images..."></form><ul class=gallery></ul><button type=button class="btn load-more-btn is-hidden">Load more</button><script src=bundle.js></script></body></html>
